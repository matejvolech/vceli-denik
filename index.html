/* ================= save ================= */
function saveHive(){
  const number = val("f-number");
  if(!number){ showErr("err-number","Vyplňte číslo úlu."); document.getElementById("f-number").focus(); return; }
  const dup = active().find(x => x.id !== F.id && String(x.number).trim().toLowerCase() === number.toLowerCase());
  if(dup){ showErr("err-number","Číslo "+number+" už má jiné včelstvo."); return; }
  const data = {number, name:val("f-name"), apiary:val("f-apiary"), color:F.color};
  if(F.id){
    const h = hiveById(F.id);
    const from = apiaryOf(h), to = data.apiary;
    if(from !== to) h.records.push({id:uid(), t:Date.now(), type:"presun", date:today(), note:"", from, to});
    Object.assign(h, data); persist(); toast("Uloženo"); back("#/v/"+F.id);
  } else {
    const h = Object.assign({id:uid(), records:[], retired:null, created:Date.now()}, data);
    DB.hives.push(h); persist(); toast("Včelstvo přidáno"); replaceTo("#/v/"+h.id);
  }
}

function saveRecord(){
  const h = hiveById(F.hive); if(!h) return;
  const r = {id:uid(), t:Date.now(), type:F.type, date:val("f-date") || today(), note:val("f-note")};
  if(F.type === "prohlidka"){
    if(!F.health && !F.strength){ showErr("err-form","Vyberte aspoň zdravotní stav nebo sílu včelstva."); return; }
    r.health = F.health; r.strength = F.strength; r.queenSeen = F.queenSeen; r.eggsSeen = F.eggsSeen;
    r.problems = F.health && F.health !== "zdrave" ? F.problems.slice() : [];
    const fr = parseInt(val("f-frames"),10); r.frames = isFinite(fr) && fr > 0 ? fr : null;
  }
  if(F.type === "krmeni" || F.type === "med"){
    const n = num(val("f-kg"));
    if(!isFinite(n) || n <= 0){ showErr("err-form","Zadejte počet kilogramů (víc než 0)."); return; }
    r.kg = Math.round(n*10)/10;
    if(F.type === "krmeni"){ r.feed = F.feed; DB.settings.lastFeed = F.feed; }
  }
  if(F.type === "leceni"){
    const d = F.drug === "__jiny" ? val("f-drug") : F.drug;
    if(!d){ showErr("err-form", F.drug === "__jiny" ? "Napište název přípravku." : "Vyberte přípravek."); return; }
    r.drug = d; r.batch = val("f-batch"); DB.settings.lastDrug = d; DB.settings.lastBatch = r.batch;
    const m = parseInt(val("f-mites"),10); r.mites = isFinite(m) && m >= 0 ? m : "";
  }
  if(F.type === "matka"){
    if(!F.year){ showErr("err-form","Vyberte rok, nebo zvolte „Nevím“."); return; }
    r.year = F.year === "nevim" ? null : +F.year; r.marked = F.marked;
  }
  h.records.push(r); persist(); toast("Uloženo ✓"); back("#/v/"+h.id);
}

function saveBulk(){
  if(!F.sel.size){ showErr("err-form","Vyberte nahoře aspoň jeden úl."); window.scrollTo(0,0); return; }
  const date = val("f-date") || today(), note = val("f-note"), t = Date.now();
  const hs = active().filter(h => F.sel.has(h.id));
  let n = 0;
  if(F.type === "leceni"){
    const d = F.drug === "__jiny" ? val("f-drug") : F.drug;
    if(!d){ showErr("err-form", F.drug === "__jiny" ? "Napište název přípravku." : "Vyberte přípravek."); return; }
    const batch = val("f-batch");
    DB.settings.lastDrug = d; DB.settings.lastBatch = batch;
    hs.forEach(h => { h.records.push({id:uid(), t, type:"leceni", date, note, drug:d, batch, mites:""}); n++; });
  }
  if(F.type === "krmeni"){
    const target = DB.settings.feedTarget || 0, y = date.slice(0,4);
    let amt = null;
    if(F.mode !== "fill"){
      amt = num(val("f-kg"));
      if(!(amt > 0)){ showErr("err-form","Zadejte, kolik kilogramů dostal každý úl."); return; }
    }
    hs.forEach(h => {
      const k = Math.round((F.mode === "fill" ? target - fedIn(h, y) : amt) * 10) / 10;
      if(k > 0){ h.records.push({id:uid(), t, type:"krmeni", date, note, kg:k, feed:F.feed}); n++; }
    });
    DB.settings.lastFeed = F.feed;
    if(!n){ toast("Vybrané úly už mají dost krmení"); return; }
  }
  if(F.type === "presun"){
    const to = val("f-apiary");
    if(!to){ showErr("err-form","Napište, na které stanoviště úly převážíte."); return; }
    hs.forEach(h => { const from = apiaryOf(h); if(from !== to){ h.records.push({id:uid(), t, type:"presun", date, note, from, to}); h.apiary = to; n++; } });
    if(!n){ toast("Vybrané úly už na tomto stanovišti jsou"); return; }
  }
  persist(); toast("Zapsáno: " + hivesN(n));
  if(stack.length > 2 && stack[stack.length-2] === "#/hromadne") history.go(-2); else back("#/");
}

function saveRetire(){
  const h = hiveById(F.hive); if(!h) return;
  if(!F.reason){ showErr("err-form","Vyberte důvod."); return; }
  h.retired = {reason:F.reason, date:val("f-date") || today(), into:F.reason === "spojeno" ? val("f-into") : "", note:val("f-note")};
  persist(); toast("Včelstvo č. "+h.number+" vyřazeno"); resetTo("#/");
}

/* ================= export / backup ================= */
let downloads = null;
(async () => { try{ if(window.claude && typeof window.claude.use === "function") downloads = await window.claude.use("downloads"); }catch(e){ downloads = null; } })();

async function saveFile(name, text, title){
  if(toApp({action:"save", filename:name, data:text})) return;
  if(downloads){
    try{ await downloads.save({filename:name, data:text}); toast("Soubor uložen"); return; }
    catch(err){
      if(err && err.code === "declined"){ toast("Soubor nebyl uložen"); return; }
      if(err && err.code === "rate_limited"){ toast("Chvíli počkejte a zkuste to znovu"); return; }
    }
  }
  try{
    const file = new File([text], name, {type: name.endsWith(".csv") ? "text/csv" : "application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:title});
      return;
    }
  }catch(err){ if(err && err.name === "AbortError") return; }
  modal('<h3>'+title+'</h3><p>Soubor tady nejde uložit přímo. Zkopírujte text a vložte ho do poznámek nebo zprávy sami sobě.</p>' +
    '<textarea id="backup-text" readonly>'+esc(text)+'</textarea>' +
    '<button class="btn primary" data-act="copy" style="margin-top:1rem">Zkopírovat</button><button class="btn" data-act="close">Zavřít</button>');
}
function doExport(){ saveFile("vceli-denik-zaloha-" + today() + ".json", JSON.stringify(DB, null, 1), "Záloha dat"); }
function csv(rows){
  return "\uFEFF" + rows.map(r => r.map(c => {
    c = String(c == null ? "" : c);
    return /[;"\n\r]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
  }).join(";")).join("\r\n");
}
function exportCsv(kind, year){
  const all = [];
  DB.hives.slice().sort(byNumber).forEach(h => h.records.forEach(r => all.push([h, r])));
  all.sort((a,b) => a[1].date < b[1].date ? -1 : a[1].date > b[1].date ? 1 : byNumber(a[0], b[0]));
  if(kind === "leceni"){
    const rows = all.filter(x => x[1].type === "leceni" && x[1].date.slice(0,4) === String(year));
    if(!rows.length){ toast("V roce "+year+" není zapsané žádné léčení"); return; }
    saveFile("evidence-leceni-"+year+".csv", csv([["Datum","Stanoviště","Číslo úlu","Přípravek","Šarže","Spad roztočů","Poznámka"]].concat(
      rows.map(x => [fmtDate(x[1].date), apiaryOf(x[0]), x[0].number, x[1].drug, x[1].batch || "", x[1].mites, x[1].note || ""]))), "Evidence léčení "+year);
  } else {
    if(!all.length){ toast("Zatím nejsou žádné záznamy"); return; }
    saveFile("vceli-denik-zaznamy-"+today()+".csv", csv([["Datum","Stanoviště","Číslo úlu","Záznam","Podrobnosti","Poznámka"]].concat(
      all.map(x => [fmtDate(x[1].date), apiaryOf(x[0]), x[0].number, (TYPES[x[1].type]||{t:x[1].type}).t, summary(x[1]), x[1].note || ""]))), "Všechny záznamy");
  }
}
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => importText(rd.result);
  rd.readAsText(f);
});
function importText(text){
  let d; try{ d = JSON.parse(text); }catch(err){ d = null; }
  if(!d || !Array.isArray(d.hives)){ toast("Tento soubor není záloha Včelího deníku"); return; }
  const n = d.hives.length;
  confirmBox("Nahrát zálohu?", "Záloha obsahuje "+colonies(n)+". Současná data v telefonu se nahradí.", "Ano, nahrát", () => {
    DB = normalize(d); DB.settings.onboarded = true; persist(); toast("Záloha nahrána"); resetTo("#/");
  });
}
/* volá aplikace: vybraný soubor zálohy, a při spuštění data uložená v telefonu */
window.__importText = importText;
window.__appData = function(text){
  let d; try{ d = JSON.parse(text); }catch(err){ return; }
  if(!d || !Array.isArray(d.hives)) return;
  DB = normalize(d);
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  storageOk = true; render();
};

/* ================= demo ================= */
function loadDemo(size){
  const d = (m,day) => Y+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(28, Math.max(1, day))).padStart(2,"0");
  const R = (type, date, x) => Object.assign({id:uid(), t:Date.now(), type, date, note:""}, x);
  const keep = {scale:DB.settings.scale, view:DB.settings.view, onboarded:true};
  DB = blank(); Object.assign(DB.settings, keep);
  if(size === "big"){
    let seed = 20260924;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    const ri = (a,b) => a + Math.floor(rnd() * (b - a + 1));
    const pick = arr => arr[Math.floor(rnd() * arr.length)];
    let no = 1;
    [["Zahrada",12],["U lesa",24],["Za humny",16]].forEach(ap => {
      for(let i = 0; i < ap[1]; i++){
        const h = {id:uid(), number:String(no++), name:"", apiary:ap[0], color:pick(COLORS).id, retired:null, records:[]};
        const qy = Y - ri(0,4);
        h.records.push(R("matka", qy === Y ? d(6, ri(1,28)) : d(5, ri(1,28)), {year:qy, marked:rnd() < .75 ? "ano" : "ne"}));
        const x = rnd(), health = x < .05 ? "nemocne" : x < .14 ? "podezreni" : "zdrave";
        const y2 = rnd(), strength = y2 < .14 ? "slabe" : y2 < .55 ? "stredni" : "silne";
        const fr = strength === "slabe" ? ri(3,5) : strength === "stredni" ? ri(6,8) : ri(9,11);
        h.records.push(R("prohlidka", d(8, ri(8,28)), {health, strength, frames:fr, ...(rnd() < .07 ? {queenSeen:"ne", eggsSeen:"ne"} : {queenSeen:rnd() < .6 ? "ano" : "ne", eggsSeen:"ano"}),
          problems: health === "zdrave" ? [] : [pick(["varroaza","kridla","nosema","vapenaty"])]}));
        h.records.push(R("med", d(6, ri(10,25)), {kg:ri(6,18)}));
        if(rnd() < .8) h.records.push(R("med", d(7, ri(15,28)), {kg:ri(4,14)}));
        const plan = rnd() < .4 ? [5,5,5] : rnd() < .5 ? [8,4] : rnd() < .6 ? [5] : [];
        plan.forEach((k,j) => h.records.push(R("krmeni", d(8 + (j > 1 ? 1 : 0), 5 + j * 10), {kg:k, feed:j ? "invert" : "roztok"})));
        if(rnd() < .8) h.records.push(R("leceni", d(8, ri(3,12)), {drug:"Formidol", batch:"F24-0617", mites:ri(5,90)}));
        if(rnd() < .35) h.records.push(R("leceni", d(9, ri(10,20)), {drug:"Gabon PF 90", batch:"G25-112", mites:""}));
        DB.hives.push(h);
      }
    });
    [["uhynulo",""],["uhynulo",""],["spojeno","14"]].forEach(r => {
      DB.hives.push({id:uid(), number:String(no++), name:"", apiary:"U lesa", color:pick(COLORS).id, records:[],
        retired:{reason:r[0], date:d(3, ri(2,25)), into:r[1], note:r[0] === "uhynulo" ? "zimní úhyn" : ""}});
    });
    DB.settings.honey = true;
  } else {
    DB.hives = [
      {id:uid(), number:"1", name:"U lípy", apiary:"Zahrada", color:"zluta", retired:null, records:[
        R("matka", d(5,20), {year:Y-1, marked:"ano"}),
        R("prohlidka", d(7,28), {health:"zdrave", strength:"silne", frames:9, queenSeen:"ano", eggsSeen:"ano", problems:[]}),
        R("krmeni", d(8,2), {kg:5, feed:"roztok"}), R("krmeni", d(8,16), {kg:5, feed:"roztok"}), R("krmeni", d(9,1), {kg:4, feed:"invert"}),
        R("leceni", d(8,10), {drug:"Formidol", batch:"", mites:42, note:"po vytočení"})
      ]},
      {id:uid(), number:"2", name:"", apiary:"Zahrada", color:"modra", retired:null, records:[
        R("matka", d(6,1), {year:Y-3, marked:"ano"}),
        R("prohlidka", d(8,20), {health:"podezreni", strength:"stredni", frames:6, queenSeen:"ne", eggsSeen:"ano", problems:["varroaza","kridla"], note:"pár včel s pokrčenými křídly"}),
        R("krmeni", d(8,22), {kg:5, feed:"roztok"})
      ]},
      {id:uid(), number:"3", name:"Oddělek", apiary:"Zahrada", color:"zelena", retired:null, records:[
        R("matka", d(6,15), {year:Y, marked:"ne"}),
        R("prohlidka", d(9,5), {health:"zdrave", strength:"slabe", frames:4, queenSeen:"ne", eggsSeen:"ne", problems:[]}),
        R("krmeni", d(9,6), {kg:3, feed:"testo"})
      ]},
      {id:uid(), number:"4", name:"", apiary:"Za lesem", color:"cervena", retired:null, records:[
        R("prohlidka", d(8,28), {health:"zdrave", strength:"silne", frames:10, queenSeen:null, eggsSeen:null, problems:[]}),
        R("krmeni", d(8,28), {kg:10, feed:"invert"}), R("krmeni", d(9,14), {kg:6, feed:"invert"}),
        R("leceni", d(9,15), {drug:"Gabon PF 90", batch:"", mites:""})
      ]}
    ];
  }
  persist(); toast(size === "big" ? "Ukázka: 52 včelstev" : "Ukázková včelstva vložena"); resetTo("#/");
}

render();
if("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
})();
